services:
  - type: web
    name: jobagent-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend:app --bind 0.0.0.0:$PORT --timeout 120 --workers 1 --log-level info
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ANTHROPIC_KEY
        sync: false
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDER_EMAIL
        sync: false
      - key: RECIPIENT_EMAIL
        sync: false
      - key: STORED_PROFILE
        sync: false
      - key: TARGET_COUNTRIES
        value: Netherlands,Germany
      - key: BACKEND_URL
        sync: false
